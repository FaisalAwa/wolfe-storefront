          - heading "Where European Influence Meets Contemporary Living" [level=2] [ref=e46]
        - generic [ref=e47]:
          - paragraph [ref=e48]: Wolfe Interior Design represents the convergence of timeless European craftsmanship and contemporary design thinking. Founded with a singular vision to create interiors that transcend trends, our studio has become a trusted partner for thoughtfully designed residences and commercial spaces rooted in beauty, functionality, and enduring quality.
          - paragraph [ref=e49]: Based in Toronto with a second atelier in Austin, Miami, Los Angeles, New York, and beyond — Wolfe Interior Design is an all-female interior design studio with over two decades of experience crafting living interiors for private clients, hospitality spaces, and developers.
          - blockquote [ref=e50]: “We believe exceptional interiors should not only be beautiful, but also connected to how people live, gather, move, and experience their everyday environment.”
          - paragraph [ref=e51]: Influenced by European lifestyle and design culture, our studio specializes in high-end residential interiors, full scale renovations, new construction, and boutique commercial spaces. We create environments that balance sophistication with warmth — layering natural stone, handcrafted metals, thoughtful layouts, and refined materiality.
          - paragraph [ref=e52]: Supported by a collaborative network of artisans, fabricators, and trades across North America and Europe, Wolfe Interior Design brings together creative vision and technical expertise to deliver interiors defined by authenticity, longevity, and unrestrained luxury.
