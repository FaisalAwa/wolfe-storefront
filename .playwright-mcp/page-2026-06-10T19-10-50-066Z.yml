          - text: Wellness Design
      - generic [ref=e87]:
        - paragraph [ref=e88]: At Wolfe Interior Design, wellness is approached not as an aesthetic trend, but as an integral part of how environments should be designed and experienced.
        - paragraph [ref=e89]: Guided by human-centric and evidence-based design principles, our work considers the direct relationship between interior environments, emotional wellbeing, physical health, and everyday experience. Our studio believes thoughtful interior design has the ability to positively influence stress, focus, rest, social connection, and the longevity of living.
        - paragraph [ref=e90]: Through the lens of environmental psychology and biophilic design, we carefully consider how elements such as natural light, spatial flow, acoustics, materiality, color theory, air quality, and ease of habitual connectivity condition more restorative living environments.
        - paragraph [ref=e91]: Our goal is to create spaces that not only feel refined and timeless, but that actively enhance the physical, emotional, and psychological wellbeing of those who experience them.
