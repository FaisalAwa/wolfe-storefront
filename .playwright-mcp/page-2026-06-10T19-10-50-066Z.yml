        - generic [ref=e67]: Founder & Creative Director
        - paragraph [ref=e68]: Jessica Neilas is the Founder and Creative Director of Wolfe Interior Design, bringing over two decades of experience in luxury residential, commercial, hospitality, and high-performance interior design across North America.
        - paragraph [ref=e69]: Known for her highly refined architectural and technically driven approach, Jessica approaches each project with a balance of creative intent, architectural understanding, and thoughtful functionality. Her work is recognized for superlative material palette, European influence, and tailored spatial planning.
        - paragraph [ref=e70]: Throughout her career, Jessica has designed and overseen projects spanning Toronto, Miami, Austin, Los Angeles, New York, and beyond — collaborating with private clients, developers, architects, and builders on full-scale renovations, custom homes, boutique hospitality spaces, and wellness-oriented environments.
